<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enquiry Form</title>
  <link rel="icon" href="data:,">

  <!-- ✅ Step 1: Lightning Out JS — replace with your actual Salesforce domain -->
  <script src="https://lancashiredev--dev.sandbox.my.salesforce.com/lightning/lightning.out.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Salesforce Sans', Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      padding: 32px;
      width: 100%;
      max-width: 640px;
    }

    .container h1 {
      font-size: 20px;
      font-weight: 600;
      color: #181818;
      margin-bottom: 4px;
    }

    .container p.subtitle {
      font-size: 14px;
      color: #6e6e6e;
      margin-bottom: 24px;
    }

    /* Loading state */
    #loadingMsg {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #6e6e6e;
      padding: 12px 0;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #d8d8d8;
      border-top-color: #0176d3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error state */
    #errorMsg {
      display: none;
      background: #fef0f0;
      border: 1px solid #f6acac;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 14px;
      color: #ba0517;
    }

    /* Success / finish state */
    #successMsg {
      display: none;
      background: #eaf6ea;
      border: 1px solid #91db8b;
      border-radius: 6px;
      padding: 16px;
      font-size: 14px;
      color: #2e7d32;
      text-align: center;
    }

    #successMsg strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    /* Flow container */
    #flowContainer {
      min-height: 100px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Enquiry Form</h1>
    <p class="subtitle">Please fill in the details below and we'll get back to you shortly.</p>

    <!-- Loading indicator -->
    <div id="loadingMsg">
      <div class="spinner"></div>
      <span>Loading form...</span>
    </div>

    <!-- Error message -->
    <div id="errorMsg"></div>

    <!-- Success message (shown after flow finishes) -->
    <div id="successMsg">
      <strong>Thank you!</strong>
      Your enquiry has been submitted successfully.
    </div>

    <!-- ✅ Step 2: Flow renders here -->
    <div id="flowContainer"></div>
  </div>

  <script>
    // ─── CONFIG — update these values ────────────────────────────────────────
    const SF_ORG_URL    = "https://lancashiredev--dev.sandbox.my.site.com/futurestudents";
    const AURA_APP      = "c:ligthningoutforms";                         // namespace:AuraAppName
    const FLOW_API_NAME = "EnquiryFormDemo";                            // Flow API name
    // ─────────────────────────────────────────────────────────────────────────

    // Optional: pass input variables into the flow
    // e.g. [{ name: "recordId", type: "String", value: "001XX000003GYkZ" }]
    const flowInputVariables = [];

    function showError(message) {
      const el = document.getElementById("errorMsg");
      el.textContent = message;
      el.style.display = "block";
      document.getElementById("loadingMsg").style.display = "none";
    }

    function onFlowStatusChange(event) {
      const status = event.getParam("status");

      if (status === "FINISHED" || status === "FINISHED_SCREEN") {
        // Hide the flow, show success message
        document.getElementById("flowContainer").style.display = "none";
        document.getElementById("successMsg").style.display = "block";
      }

      if (status === "ERROR") {
        showError("Something went wrong with the form. Please refresh and try again.");
      }
    }

    // ✅ Step 3: Initialize Lightning Out
    $Lightning.use(
      AURA_APP,
      function () {
        document.getElementById("loadingMsg").style.display = "none";

        $Lightning.createComponent(
          "lightning:flow",
          {},
          "flowContainer",
          function (flowCmp) {
            if (!flowCmp) {
              showError("Failed to load the form component. Please try again.");
              return;
            }
            // ✅ Step 4: Start the flow
            flowCmp.startFlow(FLOW_API_NAME, flowInputVariables, onFlowStatusChange);
          }
        );
      },
      SF_ORG_URL
    );
  </script>

</body>
</html>
