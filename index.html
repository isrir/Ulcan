<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Future Students</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    #sf-frame {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    /* Loading overlay — hidden once iframe fires load */
    #loader {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e2e2;
      border-top-color: #0070d2;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p {
      font-size: 14px;
      color: #555;
      letter-spacing: 0.01em;
    }

    /* X-Frame-Options error notice — shown only if frame fails */
    #frame-error {
      display: none;
      position: fixed;
      inset: 0;
      background: #f8f9fa;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 2rem;
      text-align: center;
      z-index: 20;
    }
    #frame-error.visible { display: flex; }
    #frame-error h2 { font-size: 18px; color: #1a1a1a; font-weight: 600; }
    #frame-error p  { font-size: 14px; color: #555; max-width: 480px; line-height: 1.6; }
    #frame-error a  {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 24px;
      background: #0070d2;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    #frame-error a:hover { background: #005fb2; }
  </style>
</head>
<body>

  <!-- Loading state -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Loading…</p>
  </div>

  <!-- X-Frame-Options blocked notice -->
  <div id="frame-error">
    <h2>This page can't be embedded</h2>
    <p>
      The Salesforce Experience site has blocked iframe embedding via the
      <code>X-Frame-Options</code> or <code>Content-Security-Policy</code> header.
      You'll need to allow your domain in Salesforce Setup → CORS &amp; CSP settings,
      or open the site directly.
    </p>
    <a id="direct-link" href="#" target="_blank" rel="noopener">Open site directly ↗</a>
  </div>

  <iframe
    id="sf-frame"
    src="https://lancashiredev--dev.sandbox.my.site.com/futurestudents/s/"
    title="Future Students Portal"
    allow="fullscreen; payment; camera; microphone"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    const frame   = document.getElementById('sf-frame');
    const loader  = document.getElementById('loader');
    const errBox  = document.getElementById('frame-error');
    const dirLink = document.getElementById('direct-link');
    const SRC     = frame.src;

    dirLink.href = SRC;

    /* Hide loader once frame content fires load */
    frame.addEventListener('load', () => {
      loader.classList.add('hidden');

      /*
       * Heuristic: if the frame loaded but has no accessible content
       * (blocked by X-Frame-Options), browsers still fire "load" but
       * the contentDocument is usually null or empty. Check for that.
       */
      try {
        const doc = frame.contentDocument || frame.contentWindow?.document;
        if (!doc || doc.body === null || doc.body.innerHTML.trim() === '') {
          showError();
        }
      } catch (e) {
        /* Cross-origin — normal when site loads correctly.
           Only show error if we detect a navigation to about:blank */
      }
    });

    /* Fallback: if nothing loads in 15 s, show the error */
    const timeout = setTimeout(() => {
      if (!loader.classList.contains('hidden')) showError();
    }, 15000);

    frame.addEventListener('load', () => clearTimeout(timeout));

    function showError() {
      loader.classList.add('hidden');
      errBox.classList.add('visible');
    }
  </script>

</body>
</html>
